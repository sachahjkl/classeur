name: Release

# A version tag vX.Y.Z (classeurtool ship makes it) builds classeur and publishes it: the Linux and the Windows archives,
# each with its SHA-256, the programs alone and their update manifests signed by the secret UPDATE_SIGNING_KEY (what
# installed copies update themselves from), on a GitHub release whose notes are the changelog's section of that version. The Linux job makes
# the release as a draft; the Windows job adds its files and publishes it. The tag must be APP_VERSION's (classeurtool package checks).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 40
    steps:
      # Debian 12 (bookworm): its packages from deb.debian.org, not from the runner's Ubuntu mirrors (their DNS failed for hours),
      # and its glibc 2.36: the oldest a Linux build then needs. First: checkout needs git for the submodules.
      - name: Debian's packages
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates curl jq xz-utils zstd unzip clang lld libfontconfig-dev mesa-vulkan-drivers libvulkan1 libxkbcommon0 librsvg2-2 gh >/dev/null

      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-odin-linux
      - name: Build and test
        run: |
          odin build tools/classeurtool -collection:gt=ext/gui_toolkit/src -out:build/classeurtool -vet
          build/classeurtool check
      - name: Package
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: build/classeurtool package ${{ github.ref_name }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build/classeurtool notes ${{ github.ref_name }} > build/notes.md
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" build/dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" build/dist/* --draft --title "classeur ${GITHUB_REF_NAME#v}" --notes-file build/notes.md
          fi

  windows:
    needs: release
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./ext/gui_toolkit/.github/actions/setup-odin
      - name: Build, test, package
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          odin build tools/classeurtool -collection:gt=ext/gui_toolkit/src -out:build/classeurtool.exe -vet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/classeurtool.exe check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/classeurtool.exe package ${{ github.ref_name }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" (Get-ChildItem build/dist/*).FullName --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # (public once both systems' files are there: an installed copy that checks finds its manifest)
          gh release edit "${{ github.ref_name }}" --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
