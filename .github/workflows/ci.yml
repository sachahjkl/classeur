name: CI

# Every push to master and every pull request: classeurtool check (odin check -vet of the program for Linux and Windows,
# the tests of the whole program with no window of the system, a release build).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 15
    steps:
      # Debian 12 (bookworm): its packages from deb.debian.org, not from the runner's Ubuntu mirrors (their DNS failed for hours),
      # and its glibc 2.36: the oldest a Linux build then needs. First: checkout needs git for the submodules.
      - name: Debian's packages
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates curl jq xz-utils zstd unzip clang lld libfontconfig-dev mesa-vulkan-drivers libvulkan1 libxkbcommon0 librsvg2-2 >/dev/null

      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-odin-linux
      - uses: actions/cache@v4
        with:
          path: |
            ext/gui_toolkit/build/text
            ~/.cargo/registry
          key: text-linux-${{ hashFiles('ext/gui_toolkit/native/text/**') }}
      - name: classeurtool check
        run: |
          odin build tools/classeurtool -collection:gt=ext/gui_toolkit/src -out:build/classeurtool -vet
          build/classeurtool check

  # Windows: the same checks (odin check -vet, the tests with no window of the system, a release build).
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./ext/gui_toolkit/.github/actions/setup-odin
      - name: classeurtool check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          odin build tools/classeurtool -collection:gt=ext/gui_toolkit/src -out:build/classeurtool.exe -vet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/classeurtool.exe check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
